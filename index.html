<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>BW-065 Generator</title>
<style>
body { font-family: Arial; text-align:center; }
.controls { margin: 10px; }
.grid {
  display: grid;
  justify-content: center;
  gap: 2px;
}
.cell {
  width: 20px;
  height: 20px;
  border: 1px solid #ccc;
}
textarea {
  width: 90%;
  height: 150px;
  margin-top: 10px;
}
button {
  margin: 3px;
  padding: 5px 10px;
}
</style>
</head>

<body>

<h2>BW-065 Tension-Aware Generator</h2>

<div class="controls">
Grid: <input type="number" id="gridSize" value="11" style="width:50px">
Density: <input type="range" id="density" min="0" max="1" step="0.05" value="0.4">

<br><br>

<button onclick="generate()">Generate</button> <button onclick="play()">Play</button> <button onclick="pause()">Pause</button> <button onclick="reset()">Reset</button> <button onclick="exportCSV()">Export CSV</button> <button onclick="evaluatePath()">Evaluate</button>

</div>

<div id="grid" class="grid"></div>
<textarea id="output"></textarea>

<script>
let gridData=[], path=[], step=0, timer=null;

const crossSteps=[
{dx:-0.3,dy:0.3},{dx:-0.3,dy:-0.3},
{dx:0.3,dy:-0.3},{dx:0.3,dy:0.3}
];

function generate(){
let size=parseInt(document.getElementById("gridSize").value);
let density=parseFloat(document.getElementById("density").value);

gridData=[];
for(let i=0;i<size;i++){
let row=[];
for(let j=0;j<size;j++){
let type="void";
if(i===j||i+j===size-1) type="cross";
else{
let r=Math.random();
if(r<density) type="grid";
}
row.push(type);
}
gridData.push(row);
}

path=[];
for(let i=0;i<size;i++){
for(let j=0;j<size;j++){
if(gridData[i][j]==="cross"){
crossSteps.forEach((s,idx)=>{
path.push({
x:i+s.dx,y:j+s.dy,
type: idx%2===0?"front":"back"
});
});
}
}
}

step=0;
draw();
}

function draw(){
let size=gridData.length;
let g=document.getElementById("grid");
g.innerHTML="";
g.style.gridTemplateColumns=`repeat(${size},20px)`;

for(let i=0;i<size;i++){
for(let j=0;j<size;j++){
let d=document.createElement("div");
d.className="cell";

let active=path.findIndex((p,idx)=>
Math.floor(p.x)===i &&
Math.floor(p.y)===j &&
idx<step
);

if(active!==-1){
d.style.backgroundColor=
path[active].type==="front"?"red":"blue";
}

g.appendChild(d);
}
}
}

function play(){
if(timer) return;
timer=setInterval(()=>{
step++;
if(step>path.length){
clearInterval(timer); timer=null;
}
draw();
},150);
}

function pause(){
clearInterval(timer); timer=null;
}

function reset(){
step=0; draw();
}

function exportCSV(){
if(path.length<2){alert("no data");return;}
let csv="Step,From_X,From_Y,To_X,To_Y,Type\n";
for(let i=0;i<path.length-1;i++){
let p1=path[i],p2=path[i+1];
csv+=`${i+1},${p1.x},${p1.y},${p2.x},${p2.y},${p2.type}\n`;
}
document.getElementById("output").value=csv;
}

function evaluatePath(){
let length=0, back=0;
for(let i=0;i<path.length-1;i++){
let dx=path[i+1].x-path[i].x;
let dy=path[i+1].y-path[i].y;
length+=Math.sqrt(dx*dx+dy*dy);
if(path[i+1].type==="back") back++;
}
document.getElementById("output").value=
`Length: ${length.toFixed(2)}\nBack: ${back}`;
}
</script>

</body>
</html>
